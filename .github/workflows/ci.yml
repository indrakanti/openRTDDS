name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check requirement traces
        run: python3 tools/check_requirement_traces.py
      - name: Verify pinned vendor fixture hashes
        run: python3 tests/interop/verify_fixtures.py
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DOPENRTDDS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  vendor-packets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned vendor implementations
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfastrtps-dev=2.11.2+ds-6.1build3 \
            fastddsgen=2.3.0+dfsg-1 \
            cyclonedds-dev=0.10.4-1.1build3 cyclonedds-tools
      - name: Build vendor emitters and OpenRTDDS probe
        run: |
          mkdir -p /tmp/vendor-idl
          idlc -l c -o /tmp/vendor-idl tests/interop/VendorProbe.idl
          mkdir -p /tmp/vendor-fastdds
          (cd tests/interop && fastddsgen -d /tmp/vendor-fastdds VendorProbe.idl)
          cc -std=c11 -Wall -Wextra -Werror -I/tmp/vendor-idl \
            tests/interop/emit_cyclone.c /tmp/vendor-idl/VendorProbe.c \
            -lddsc -o /tmp/emit_cyclone
          c++ -std=c++17 -Wall -Wextra -Werror -I/tmp/vendor-fastdds \
            tests/interop/emit_fastdds.cpp \
            /tmp/vendor-fastdds/VendorProbe.cxx \
            /tmp/vendor-fastdds/VendorProbePubSubTypes.cxx \
            -lfastrtps -lfastcdr -pthread \
            -o /tmp/emit_fastdds
          cmake -S . -B build -DOPENRTDDS_WARNINGS_AS_ERRORS=ON \
            -DOPENRTDDS_BUILD_EXAMPLES=ON
          cmake --build build --target openrtdds_vendor_packet_probe \
            openrtdds_vendor_best_effort_writer \
            openrtdds_vendor_best_effort_reader --parallel
      - name: Validate capture filter
        run: python3 -m unittest discover -s tests/interop -p 'test_*.py'
      - name: Capture Fast DDS SPDP packet
        run: |
          python3 tests/interop/capture_spdp.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --output artifacts/vendor-packets/fastdds/spdp.rtps \
            -- /tmp/emit_fastdds
          ./build/openrtdds_vendor_packet_probe \
            artifacts/vendor-packets/fastdds/spdp.rtps
      - name: Capture Cyclone DDS SPDP packet
        run: |
          python3 tests/interop/capture_spdp.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --output artifacts/vendor-packets/cyclonedds/spdp.rtps \
            -- /tmp/emit_cyclone
          ./build/openrtdds_vendor_packet_probe \
            artifacts/vendor-packets/cyclonedds/spdp.rtps
      - name: Capture Fast DDS SEDP publication
        run: |
          sudo python3 tests/interop/capture_sedp.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --output artifacts/vendor-packets/fastdds/sedp.rtps \
            -- /tmp/emit_fastdds
          ./build/openrtdds_vendor_packet_probe --sedp \
            artifacts/vendor-packets/fastdds/sedp.rtps \
            artifacts/vendor-packets/fastdds/sedp-participant.rtps
      - name: Capture Cyclone DDS SEDP publication
        run: |
          sudo python3 tests/interop/capture_sedp.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --output artifacts/vendor-packets/cyclonedds/sedp.rtps \
            -- /tmp/emit_cyclone
          ./build/openrtdds_vendor_packet_probe --sedp \
            artifacts/vendor-packets/cyclonedds/sedp.rtps \
            artifacts/vendor-packets/cyclonedds/sedp-participant.rtps
      - name: Capture Fast DDS best-effort user DATA
        run: |
          sudo -E env FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
            python3 tests/interop/capture_data.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --output artifacts/vendor-packets/fastdds/data-best-effort.rtps \
            -- /tmp/emit_fastdds
          ./build/openrtdds_vendor_packet_probe --data \
            artifacts/vendor-packets/fastdds/data-best-effort.rtps \
            artifacts/vendor-packets/fastdds/data-best-effort-endpoint.rtps \
            artifacts/vendor-packets/fastdds/data-best-effort-participant.rtps
      - name: Capture Cyclone DDS best-effort user DATA
        run: |
          sudo python3 tests/interop/capture_data.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --output artifacts/vendor-packets/cyclonedds/data-best-effort.rtps \
            -- /tmp/emit_cyclone
          ./build/openrtdds_vendor_packet_probe --data \
            artifacts/vendor-packets/cyclonedds/data-best-effort.rtps \
            artifacts/vendor-packets/cyclonedds/data-best-effort-endpoint.rtps \
            artifacts/vendor-packets/cyclonedds/data-best-effort-participant.rtps
      - name: Capture Fast DDS reliable DATA control chain
        run: |
          sudo -E env FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
            python3 tests/interop/capture_reliable.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --output artifacts/vendor-packets/fastdds/data-reliable.rtps \
            -- /tmp/emit_fastdds
          ./build/openrtdds_vendor_packet_probe --reliable \
            artifacts/vendor-packets/fastdds/data-reliable.rtps \
            artifacts/vendor-packets/fastdds/data-reliable-publisher-endpoint.rtps \
            artifacts/vendor-packets/fastdds/data-reliable-publisher-participant.rtps \
            artifacts/vendor-packets/fastdds/data-reliable-heartbeat.rtps \
            artifacts/vendor-packets/fastdds/data-reliable-acknack.rtps \
            artifacts/vendor-packets/fastdds/data-reliable-subscriber-endpoint.rtps \
            artifacts/vendor-packets/fastdds/data-reliable-subscriber-participant.rtps
      - name: Capture Cyclone DDS reliable DATA control chain
        env:
          CYCLONEDDS_URI: '<CycloneDDS><Domain id="any"><Discovery><SPDPInterval>1s</SPDPInterval></Discovery></Domain></CycloneDDS>'
        run: |
          sudo --preserve-env=CYCLONEDDS_URI \
            python3 tests/interop/capture_reliable.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --output artifacts/vendor-packets/cyclonedds/data-reliable.rtps \
            -- /tmp/emit_cyclone
          ./build/openrtdds_vendor_packet_probe --reliable \
            artifacts/vendor-packets/cyclonedds/data-reliable.rtps \
            artifacts/vendor-packets/cyclonedds/data-reliable-publisher-endpoint.rtps \
            artifacts/vendor-packets/cyclonedds/data-reliable-publisher-participant.rtps \
            artifacts/vendor-packets/cyclonedds/data-reliable-heartbeat.rtps \
            artifacts/vendor-packets/cyclonedds/data-reliable-acknack.rtps \
            artifacts/vendor-packets/cyclonedds/data-reliable-subscriber-endpoint.rtps \
            artifacts/vendor-packets/cyclonedds/data-reliable-subscriber-participant.rtps
      - name: Exchange OpenRTDDS writer to Fast DDS reader
        run: |
          FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
            python3 tests/interop/run_live_writer.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --evidence artifacts/vendor-packets/fastdds/live-openrtdds-writer.json \
            --reader /tmp/emit_fastdds \
            --writer ./build/openrtdds_vendor_best_effort_writer \
            --writer-address "$(hostname -I | cut -d' ' -f1)"
      - name: Exchange OpenRTDDS writer to Cyclone DDS reader
        env:
          CYCLONEDDS_URI: '<CycloneDDS><Domain id="any"><Discovery><SPDPInterval>1s</SPDPInterval></Discovery></Domain></CycloneDDS>'
        run: |
          python3 tests/interop/run_live_writer.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --evidence artifacts/vendor-packets/cyclonedds/live-openrtdds-writer.json \
            --reader /tmp/emit_cyclone \
            --writer ./build/openrtdds_vendor_best_effort_writer \
            --writer-address "$(hostname -I | cut -d' ' -f1)"
      - name: Exchange reliable OpenRTDDS writer to Fast DDS reader
        run: |
          FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
            python3 tests/interop/run_live_writer.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --evidence artifacts/vendor-packets/fastdds/live-openrtdds-reliable-writer.json \
            --reader /tmp/emit_fastdds \
            --writer ./build/openrtdds_vendor_best_effort_writer \
            --writer-address "$(hostname -I | cut -d' ' -f1)" \
            --qos reliable
      - name: Exchange reliable OpenRTDDS writer to Cyclone DDS reader
        env:
          CYCLONEDDS_URI: '<CycloneDDS><Domain id="any"><Discovery><SPDPInterval>1s</SPDPInterval></Discovery></Domain></CycloneDDS>'
        run: |
          python3 tests/interop/run_live_writer.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --evidence artifacts/vendor-packets/cyclonedds/live-openrtdds-reliable-writer.json \
            --reader /tmp/emit_cyclone \
            --writer ./build/openrtdds_vendor_best_effort_writer \
            --writer-address "$(hostname -I | cut -d' ' -f1)" \
            --qos reliable
      - name: Exchange Fast DDS writer to OpenRTDDS reader
        run: |
          FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
            python3 tests/interop/run_live_reader.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --evidence artifacts/vendor-packets/fastdds/live-openrtdds-reader.json \
            --writer /tmp/emit_fastdds \
            --reader ./build/openrtdds_vendor_best_effort_reader \
            --reader-address "$(hostname -I | cut -d' ' -f1)"
      - name: Exchange Cyclone DDS writer to OpenRTDDS reader
        env:
          CYCLONEDDS_URI: '<CycloneDDS><Domain id="any"><Discovery><SPDPInterval>1s</SPDPInterval></Discovery></Domain></CycloneDDS>'
        run: |
          python3 tests/interop/run_live_reader.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --evidence artifacts/vendor-packets/cyclonedds/live-openrtdds-reader.json \
            --writer /tmp/emit_cyclone \
            --reader ./build/openrtdds_vendor_best_effort_reader \
            --reader-address "$(hostname -I | cut -d' ' -f1)"
      - name: Exchange reliable Fast DDS writer to OpenRTDDS reader
        run: |
          FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
            python3 tests/interop/run_live_reader.py \
            --vendor fastdds \
            --version "$(dpkg-query -W -f='${Version}' libfastrtps-dev)" \
            --evidence artifacts/vendor-packets/fastdds/live-openrtdds-reliable-reader.json \
            --writer /tmp/emit_fastdds \
            --reader ./build/openrtdds_vendor_best_effort_reader \
            --reader-address "$(hostname -I | cut -d' ' -f1)" \
            --qos reliable
      - name: Exchange reliable Cyclone DDS writer to OpenRTDDS reader
        env:
          CYCLONEDDS_URI: '<CycloneDDS><Domain id="any"><Discovery><SPDPInterval>1s</SPDPInterval></Discovery></Domain></CycloneDDS>'
        run: |
          python3 tests/interop/run_live_reader.py \
            --vendor cyclonedds \
            --version "$(dpkg-query -W -f='${Version}' cyclonedds-dev)" \
            --evidence artifacts/vendor-packets/cyclonedds/live-openrtdds-reliable-reader.json \
            --writer /tmp/emit_cyclone \
            --reader ./build/openrtdds_vendor_best_effort_reader \
            --reader-address "$(hostname -I | cut -d' ' -f1)" \
            --qos reliable
      - name: Preserve captured packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-vendor-packets
          path: artifacts/vendor-packets/
          if-no-files-found: warn

  ros2-jazzy-lifecycle-abi:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-core
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS build and ABI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential cmake python3-colcon-common-extensions
      - name: Build Jazzy RMW lifecycle slice
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --base-paths rmw_openrtdds_cpp \
            --packages-select rmw_openrtdds_cpp \
            --event-handlers console_direct+ \
            --cmake-args -DBUILD_TESTING=ON
      - name: Run lifecycle tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select rmw_openrtdds_cpp \
            --event-handlers console_direct+
          colcon test-result --verbose
      - name: Verify package registration, load, and ABI symbols
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          resource=install/rmw_openrtdds_cpp/share/ament_index/resource_index/rmw_typesupport/rmw_openrtdds_cpp
          library=install/rmw_openrtdds_cpp/lib/librmw_openrtdds_cpp.so
          test -f "$resource"
          test ! -s "$resource"
          test -f "$library"
          python3 tools/check_rmw_symbols.py \
            "$library" rmw_openrtdds_cpp/abi_symbols.txt
          python3 - "$library" <<'PY'
          import ctypes
          import sys

          library = ctypes.CDLL(sys.argv[1])
          library.rmw_get_implementation_identifier.restype = ctypes.c_char_p
          assert library.rmw_get_implementation_identifier() == b"rmw_openrtdds_cpp"
          PY
